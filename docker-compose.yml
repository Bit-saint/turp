version: '3.8'

services:
  osint-tool:
    build: .
    container_name: russian-military-osint
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./config:/app/config
    command: python main.py --topics-file config/topics.yaml --format markdown
    restart: "no"

  # Optional: Run with custom topics
  osint-custom:
    build: .
    container_name: osint-custom
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
    command: python main.py --topics "Wagner Group" "GRU Operations"
    profiles:
      - custom
    restart: "no"
