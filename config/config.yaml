# OSINT Tool Configuration

# API Settings
# Set these in .env file or environment variables
# GOOGLE_API_KEY=your-key-here
# SERPER_API_KEY=your-key-here

# Search Configuration
search:
  max_results: 10
  language: "en"
  country: "us"
  default_timeframe: "past_month"

# Report Generation
report:
  output_dir: "./reports"
  default_format: "markdown"
  max_concurrent_topics: 5

# Analysis Settings
analysis:
  default_depth: "comprehensive"
  temperature: 0.3
  max_tokens: 8192

# Priority Levels
# 10 = Critical
# 9 = High
# 8 = Important
# 7 = Medium
# 6 = Normal
# 5 = Low

# Output Settings
output:
  verbose: false
  save_json: true
  save_markdown: true
  save_html: false
  include_raw_data: false
